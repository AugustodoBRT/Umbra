name: Build Umbra
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv libx11-dev cmake python3-libtorrent python-is-python3 xvfb
      - run: npm ci
      - name: Prepare Electron runtime
        run: node -p "require('electron')"
      - run: npm run build
      - run: npm test
      - name: Test embedded player in Electron
        run: xvfb-run -a npm run test:player
        env:
          CINESSD_ELECTRON: ./node_modules/electron/dist/electron
          CINESSD_CAPTURE_VIRTUAL_SCREEN: '1'
          CINESSD_MPV_VO: x11
      - name: Test catalog and history in Electron
        run: xvfb-run -a npm run test:desktop
        env:
          CINESSD_ELECTRON: ./node_modules/electron/dist/electron
          CINESSD_MPV_VO: x11
      - name: Test online library and downloads
        run: xvfb-run -a npm run test:online
        env:
          CINESSD_ELECTRON: ./node_modules/electron/dist/electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: test-results/*.png
  windows:
    timeout-minutes: 15
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements.txt
      - run: npm ci
      - run: python -m pip install -r packaging/windows/requirements.txt
      - run: npm run prepare:windows
      - run: npm run package:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows app and included tools
        run: npm run test:windows
        env:
          DEBUG: pw:browser
          CINESSD_CAPTURE_VIRTUAL_SCREEN: '1'
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release\Umbra-*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding utf8 release\SHA256SUMS.txt
          Copy-Item packaging\windows\cache\ffmpeg.zip release\ffmpeg-9.0.2-win64-original.zip
          Copy-Item packaging\windows\cache\mpv.7z release\mpv-20261004-win64-original.7z
          Copy-Item packaging\windows\cache\vulkan-runtime.zip release\vulkan-1.4.363.0-win64-original.zip
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-windows-x64
          path: |
            release/Umbra-*.exe
            release/SHA256SUMS.txt
            release/ffmpeg-9.0.2-win64-original.zip
            release/mpv-20261004-win64-original.7z
            release/vulkan-1.4.363.0-win64-original.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: test-results/*.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: umbra-windows-x64
          path: release
      - name: Publish tested Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Umbra $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
