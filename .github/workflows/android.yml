name: Android APK and updates
on:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'scripts/android/**', 'package*.json', 'capacitor.config.ts', 'vite.mobile.config.ts', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - name: Test Android library and update logic
        run: node --import tsx --test tests/android.test.ts
      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Configure Android signing secrets before publishing.'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umbra.jks"
          chmod 600 "$RUNNER_TEMP/umbra.jks"
      - name: Build and verify signed APK
        run: npm run android:apk
        env:
          UMBRA_KEYSTORE: ${{ runner.temp }}/umbra.jks
          UMBRA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          UMBRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UMBRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-android
          path: release/android/*
      - name: Publish update
        run: node scripts/android/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/umbra.jks"
